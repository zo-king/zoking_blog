name: Preflight

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.12
          working-directory: apps/api

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Audit production npm dependencies
        working-directory: apps/admin
        run: npm run audit:security

      - name: ESLint
        working-directory: apps/admin
        run: npm run lint

      - name: Prettier check
        working-directory: apps/admin
        run: npm run format:check

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zoking_blog_test
          POSTGRES_USER: zoking
          POSTGRES_PASSWORD: zoking_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zoking -d zoking_blog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      CGO_ENABLED: "1"
      DATABASE_URL: postgres://zoking:zoking_dev_password@localhost:5432/zoking_blog_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run focused Go race tests
        working-directory: apps/api
        shell: bash
        run: |
          go test -race -count=1 \
            ./internal/httpapi \
            ./internal/publisher \
            ./internal/maintenance

  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zoking_blog_test
          POSTGRES_USER: zoking
          POSTGRES_PASSWORD: zoking_dev_password
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U zoking -d zoking_blog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      APP_PORT: "18080"
      DATABASE_URL: postgres://zoking:zoking_dev_password@localhost:15432/zoking_blog_test?sslmode=disable
      JWT_SECRET: ci-only-change-me-with-long-random-string
      ADMIN_ALLOWED_ORIGINS: http://localhost:5173
      SEED_ADMIN_EMAIL: admin@zoking.local
      SEED_ADMIN_PASSWORD: "ChangeMe123!"
      PUBLISH_WORKER_ENABLED: "true"
      PUBLISH_JOB_TIMEOUT: 3m

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@6b1ee2dcc06c9b6629a5317fa0146473914d05e1 # v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Export Hugo binary path
        shell: bash
        run: echo "HUGO_BIN=$(command -v hugo)" >> "$GITHUB_ENV"

      - name: Run deployment preflight
        shell: pwsh
        run: >
          ./scripts/qa/preflight.ps1
          -Install
          -StartApi
          -BootstrapTestData
          -StopStartedApi
          -AdminEmail $env:SEED_ADMIN_EMAIL
          -AdminPassword $env:SEED_ADMIN_PASSWORD
          -PublishTimeoutSeconds 240

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Scan reachable Go vulnerabilities
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build API image
        run: docker build --tag zoking-api:ci --file apps/api/Dockerfile .

      - name: Scan API image
        id: scan_api
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zoking-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Build Admin image
        run: docker build --tag zoking-admin:ci --file apps/admin/Dockerfile .

      - name: Scan Admin image
        id: scan_admin
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zoking-admin:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Build GoatCounter image
        run: docker build --tag zoking-goatcounter:ci --file infra/docker/goatcounter.Dockerfile .

      - name: Scan GoatCounter image
        id: scan_goatcounter
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zoking-goatcounter:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Enforce image scan results
        if: always()
        env:
          API_SCAN: ${{ steps.scan_api.outcome }}
          ADMIN_SCAN: ${{ steps.scan_admin.outcome }}
          GOATCOUNTER_SCAN: ${{ steps.scan_goatcounter.outcome }}
        run: |
          printf 'API=%s Admin=%s GoatCounter=%s\n' "$API_SCAN" "$ADMIN_SCAN" "$GOATCOUNTER_SCAN"
          test "$API_SCAN" = success
          test "$ADMIN_SCAN" = success
          test "$GOATCOUNTER_SCAN" = success
