# Shared security headers for the admin SPA.
# Included by every location in nginx.conf. Copied into the image at
# /etc/nginx/snippets/admin-security-headers.conf (see Dockerfile).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# CSP kept intentionally permissive on connect-src (admin talks to a cross-origin
# API over https) and on inline styles (Arco Design injects them). Tighten later
# if you pin the exact API origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
